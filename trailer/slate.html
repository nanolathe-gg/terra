<!doctype html>
<meta charset="utf-8">
<title>Trailer slate</title>
<!-- A placeholder card for the trailer (docs/TRAILER.md): ?title=..&sub=..&seconds=4. Captured like the explainer (trailer/render-explainer.mjs --page). -->
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const q = new URLSearchParams(location.search), title = q.get('title') || '', sub = q.get('sub') || '', seconds = Number(q.get('seconds') || 4);
const ctx = document.getElementById('c').getContext('2d');
const ease = t => { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); };
window.frame = n => {
  const t = n / 30, a = ease(t / .6) * (1 - ease((t - seconds + .6) / .6));
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1280, 720);
  ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = '500 44px "Helvetica Neue", Helvetica, Arial, sans-serif'; ctx.fillText(title, 640, 350);
  ctx.font = '400 24px "Helvetica Neue", Helvetica, Arial, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillText(sub, 640, 400);
  ctx.globalAlpha = 1;
};
window.frames = Math.round(seconds * 30); window.ready = true;
</script>
