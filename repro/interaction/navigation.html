<!doctype html><html lang="en"><meta charset="utf-8"><title>Map navigation checks</title>
<style>body{background:#172127;color:#def;font:15px system-ui;margin:24px}button{padding:10px}pre{white-space:pre-wrap}iframe{width:1280px;height:900px;border:1px solid #678}</style>
<h1>Map navigation checks</h1><p>8×8 terrain, cold scrolling under load, a stalled render, and final-image fidelity.</p>
<button id="run">Run navigation checks</button><pre id="results" role="status">Ready</pre><div id="host"></div>
<script type="module">
const output=document.querySelector('#results'),button=document.querySelector('#run'),query=new URLSearchParams(location.search);
const delay=ms=>new Promise(r=>setTimeout(r,ms)),assert=(ok,message)=>{if(!ok)throw Error(message);};
const line=s=>output.textContent+=s+'\n';
button.onclick=async()=>{
  button.disabled=true;output.textContent='Running…\n';window.navigationResult=null;
  let release;
  try{
    const frame=document.createElement('iframe');frame.title='Navigation test editor';
    frame.src='/?biome=green&mapX=8&mapY=8&interaction=1&scratch=navigation-check&heapMB=2048&weatheredView=1';
    document.querySelector('#host').replaceChildren(frame);
    const started=performance.now();
    while(!frame.contentWindow.interactionEditor?.ready()){assert(performance.now()-started<90000,'Startup timed out');await delay(100);}
    const w=frame.contentWindow,d=frame.contentDocument,a=w.interactionEditor,c=a.canvas,v=d.getElementById('viewport'),terrain=d.getElementById('terrain'),P=w.interactionPerf;
    const next=()=>new Promise(r=>w.requestAnimationFrame(r));
    const strokes=[];
    for(let y=0;y<3;y++)for(let x=0;x<3;x++)strokes.push(['landform',[[400+x*1300,450+y*1250],[650+x*1300,550+y*1250]],{card:{diameter:650,amount:120,roughness:35}}]);
    a.scene(strokes,{ground:true});await a.settle();line('Fit preview ready');
    c.zoom(1);v.scrollTo(0,0);await next();await a.settle();line('Close view ready');
    const pixels=()=>terrain.getContext('2d').getImageData(0,0,terrain.width,terrain.height).data;
    const difference=(a,b)=>{assert(a.length===b.length,'Capture dimensions differ');let changed=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])changed++;return changed;};
    // Hold a real tile after its fields have been prepared, simulating a GPU
    // occupied by other work. Input and cached presentation must keep running.
    const renderer=c.renderer,render=renderer.renderChunk.bind(renderer);
    const gate=new Promise(r=>release=r);let entered=false;
    renderer.renderChunk=async(...args)=>{if(!entered){entered=true;await gate;}return render(...args);};
    v.scrollTo(1400,600);
    const waitStart=performance.now();while(!entered){assert(performance.now()-waitStart<60000,'No cold tile requested');await delay(20);}
    P.reset();const intervals=[],presentFrames=[];let last=w.performance.now();
    const before=pixels();
    for(let i=1;i<=45;i++){
      v.scrollTo(1400+i*25,600+i*8);
      // Bounded main-thread load in addition to the stalled terrain worker.
      const until=w.performance.now()+6;while(w.performance.now()<until){}
      const count=P.events.filter(e=>e.type==='present').length;
      await next();const now=w.performance.now();intervals.push(now-last);last=now;
      presentFrames.push(P.events.filter(e=>e.type==='present').length>count);
    }
    const changedDuringWait=difference(before,pixels()),cachedPresents=P.events.filter(e=>e.type==='present'&&e.detail&&!e.fresh).length;
    const save=async(name,data)=>{const response=await fetch('/interaction/save/'+name,{method:'POST',body:data instanceof Blob?data:JSON.stringify(data)});assert(response.ok,'Could not save evidence');};
    const png=async name=>save(name,await new Promise(r=>terrain.toBlob(r)));
    await png('navigation-preview.png');
    const resumed=performance.now(),view=c.view(),tileSize=c.stats().displayChunkSize??c.stats().canonicalChunkSize,expected=[];
    for(let y=Math.floor(view.y/tileSize)*tileSize;y<view.y+view.height;y+=tileSize)for(let x=Math.floor(view.x/tileSize)*tileSize;x<view.x+view.width;x+=tileSize)expected.push(x+','+y+','+tileSize+',detail');
    let visibleFinalMs=null,settled=false;release();
    const settling=a.settle().finally(()=>settled=true);
    while(!settled){
      const tiles=c.cacheSnapshot();
      if(visibleFinalMs===null&&expected.every(key=>tiles.some(e=>e.key===key&&!e.dirty&&(e.scale??1)===1)))visibleFinalMs=performance.now()-resumed;
      await next();
    }
    await settling;renderer.renderChunk=render;
    const settleMs=performance.now()-resumed,final=pixels();
    const visible=e=>e.x<view.x+view.width&&e.y<view.y+view.height&&e.x+e.width>view.x&&e.y+e.height>view.y;
    const visibleTiles=c.cacheSnapshot().filter(e=>e.key.endsWith(',detail')&&visible(e));
    assert(visibleTiles.length>0&&visibleTiles.every(e=>!e.dirty&&(e.scale??1)===1),'Visible tiles did not reach final quality');
    await png('navigation-final.png');
    c.invalidate();await a.settle();const forcedRefreshDifference=difference(final,pixels());
    assert(forcedRefreshDifference===0,'Navigation result differs from a fresh render');
    const expectView=async(x,y,label)=>{await next();await a.settle();const s=c.view();assert(Math.abs(s.x-x)<=1&&Math.abs(s.y-y)<=1,label+' moved to the wrong position');};
    // Exercise actual middle-button and minimap pointer handlers as well as
    // scrolling. Synthetic pointers bypass capture only for this test ID.
    const o=d.getElementById('overlay'),nav=d.querySelector('[data-nav]');
    for(const el of [o,nav]){const capture=el.setPointerCapture.bind(el);el.setPointerCapture=id=>{if(id!==9042)capture(id);};}
    const emit=(el,type,x,y,button=0)=>el.dispatchEvent(new w.PointerEvent(type,{clientX:x,clientY:y,pointerId:9042,pointerType:'mouse',bubbles:true,button,buttons:type==='pointerup'?0:button===1?4:1,isPrimary:true}));
    const box=o.getBoundingClientRect(),left=v.scrollLeft,top=v.scrollTop;
    emit(o,'pointerdown',box.left+300,box.top+300,1);emit(o,'pointermove',box.left+420,box.top+350,1);emit(o,'pointerup',box.left+420,box.top+350,1);
    await expectView(left-120,top-50,'Middle-button pan');
    const nb=nav.getBoundingClientRect();emit(nav,'pointerdown',nb.left+nb.width*.5,nb.top+nb.height*.5);emit(nav,'pointermove',nb.left+nb.width*.6,nb.top+nb.height*.6);emit(nav,'pointerup',nb.left+nb.width*.6,nb.top+nb.height*.6);
    await expectView(a.config.map.width*.6-terrain.width/2,a.config.map.height*.6-terrain.height/2,'Minimap drag');
    nav.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await next();await a.settle();
    v.scrollTo(view.x,view.y);await next();await a.settle();c.zoom('overview');await a.settle();c.zoom(1);v.scrollTo(view.x,view.y);await next();await a.settle();
    const zoomRoundTripDifference=difference(final,pixels());assert(zoomRoundTripDifference===0,'Fit/1× round trip differs');
    // A second cold route runs without the artificial stall. Newly visible
    // terrain must arrive while input is still moving, even under CPU load.
    v.scrollTo(0,2800);await next();P.reset();const coldIntervals=[],coldPresentFrames=[];last=w.performance.now();
    for(let i=1;i<=45;i++){
      v.scrollTo(i*25,2800-i*8);const until=w.performance.now()+6;while(w.performance.now()<until){}
      const count=P.events.filter(e=>e.type==='present').length;await next();const now=w.performance.now();coldIntervals.push(now-last);last=now;coldPresentFrames.push(P.events.filter(e=>e.type==='present').length>count);
    }
    const coldBakesDuringInput=P.events.filter(e=>e.type==='bake-start').length;
    const coldFreshPresents=P.events.filter(e=>e.type==='present'&&e.fresh).length;
    await a.settle();
    let retainedDuringSmallPan=null,abortedOffscreen=null,heldPanDifference=null;
    if(!query.has('baseline')){
      // Pause field preparation to check cancellation precisely. A small pan
      // keeps this tile visible; a distant jump must abort the queued request.
      const feed=a.region.gpuFeedSource.bind(a.region);
      let captured=null,gate;
      const hold=()=>{captured=null;gate=new Promise(r=>release=r);};
      const waitFor=async(test,label)=>{const start=w.performance.now();while(!test()){assert(w.performance.now()-start<15000,label+' timed out');await next();}};
      a.region.gpuFeedSource=async(signal,...args)=>{if(!captured){captured={signal};await gate;}return feed(signal,...args);};
      try{
        hold();c.invalidate();await waitFor(()=>captured,'Queued tile');
        const box=o.getBoundingClientRect();
        emit(o,'pointerdown',box.left+400,box.top+300,1);
        emit(o,'pointermove',box.left+392,box.top+300,1);await next();await next();
        retainedDuringSmallPan=!captured.signal.aborted;
        assert(retainedDuringSmallPan,'A still-visible tile was canceled by a small pan');
        P.reset();release();
        const held=c.view(),heldKeys=[];
        for(let y=Math.floor(held.y/tileSize)*tileSize;y<held.y+held.height;y+=tileSize)for(let x=Math.floor(held.x/tileSize)*tileSize;x<held.x+held.width;x+=tileSize)heldKeys.push(x+','+y+','+tileSize+',detail');
        await waitFor(()=>heldKeys.every(key=>c.cacheSnapshot().some(e=>e.key===key&&!e.dirty&&(e.scale??1)===1)),'Rendering during a held pan');
        assert(P.events.some(e=>e.type==='present'&&e.fresh),'No fresh terrain appeared before pan release');
        const duringHold=pixels();emit(o,'pointerup',box.left+392,box.top+300,1);await a.settle();
        heldPanDifference=difference(duringHold,pixels());assert(heldPanDifference===0,'In-flight tile was painted at stale camera coordinates');
        hold();c.invalidate();await waitFor(()=>captured,'Offscreen cancellation');
        v.scrollTo(0,0);await next();await next();abortedOffscreen=captured.signal.aborted;
        assert(abortedOffscreen,'Queued offscreen tile was not canceled');release();await a.settle();
      }finally{release?.();a.region.gpuFeedSource=feed;}
    }
    const ordered=intervals.slice().sort((a,b)=>a-b),coldOrdered=coldIntervals.slice().sort((a,b)=>a-b),result={map:'8x8',inputFrames:45,presentFrames:presentFrames.filter(Boolean).length,cachedPresents,changedDuringWait,frameMedian:ordered[Math.floor(ordered.length*.5)],frameP95:ordered[Math.floor(ordered.length*.95)],frameMax:ordered.at(-1),visibleFinalMs,settleMs,coldPresentFrames:coldPresentFrames.filter(Boolean).length,coldFrameP95:coldOrdered[Math.floor(coldOrdered.length*.95)],coldBakesDuringInput,coldFreshPresents,retainedDuringSmallPan,abortedOffscreen,heldPanDifference,forcedRefreshDifference,zoomRoundTripDifference,errors:d.getElementById('error').textContent};
    await save('navigation.json',result);line(JSON.stringify(result,null,2));
    if(!query.has('baseline')){assert(result.presentFrames>=40,'Cached view stopped updating behind a terrain render');assert(changedDuringWait>0&&cachedPresents>0,'No terrain preview while waiting');assert(coldBakesDuringInput>0&&coldFreshPresents>0,'New terrain waited for scrolling to stop');assert(result.coldPresentFrames>=40,'Cold scrolling missed presentations');}
    assert(!result.errors,'Editor error: '+result.errors);window.navigationResult={passed:true,...result};line('PASS');
  }catch(error){window.navigationResult={passed:false,error:error.stack};line('FAIL '+error.stack);}
  finally{release?.();button.disabled=false;}
};
if(query.has('auto'))button.click();
</script>
