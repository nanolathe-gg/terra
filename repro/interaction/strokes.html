<!doctype html><html lang="en"><meta charset="utf-8"><title>Simplified stroke checks</title>
<style>body{background:#172127;color:#def;font:15px system-ui;margin:24px}button{padding:10px}pre{white-space:pre-wrap;line-height:1.5}iframe{width:1280px;height:900px;border:1px solid #678}</style>
<h1>Simplified stroke checks</h1><p>Uses the interaction host and real editor pointer handlers. Tests whole-map and paged fields.</p>
<label>Map size <select id="units"><option value="1">1×1 · whole-map</option><option value="5">5×5 · paged</option></select></label>
<button id="run">Run stroke checks</button><pre id="results" role="status">Ready</pre><div id="host"></div>
<script type="module">
const output=document.querySelector('#results'),button=document.querySelector('#run');
const assert=(ok,message)=>{if(!ok)throw Error(message);},same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const delay=ms=>new Promise(r=>setTimeout(r,ms)),line=s=>output.textContent+=s+'\n';
button.onclick=async()=>{
  button.disabled=true;output.textContent='Running…\n';let frame;
  try{
    for(const units of [Number(document.querySelector('#units').value)]){
      frame=document.createElement('iframe');frame.title='Stroke test editor';
      frame.src=`/?biome=green&mapX=${units}&mapY=${units}&interaction=1&scratch=stroke-check-${Date.now()}`;
      document.querySelector('#host').replaceChildren(frame);
      const started=performance.now();
      while(!frame.contentWindow.interactionEditor?.ready()){
        assert(performance.now()-started<60000,'Editor startup timed out');await delay(100);
      }
      const w=frame.contentWindow,d=frame.contentDocument,a=w.interactionEditor,r=a.region,$=id=>d.getElementById(id);
      $('weather').checked=false;$('weather').dispatchEvent(new w.Event('change',{bubbles:true}));
      a.scene([],{ground:false});await a.settle();
      const o=$('overlay'),capture=o.setPointerCapture.bind(o);
      o.setPointerCapture=id=>{if(id!==9042)capture(id);};
      const emit=(type,x,y)=>{const b=o.getBoundingClientRect(),v=a.canvas.view();o.dispatchEvent(new w.PointerEvent(type,{clientX:b.left+(x-v.x)*v.scale,clientY:b.top+(y-v.y)*v.scale,pointerId:9042,pointerType:'mouse',bubbles:true,button:0,buttons:type==='pointerup'?0:1,isPrimary:true}));};
      // Surface paint leaves heights unchanged, so projection cannot perturb
      // the sampled coordinates when comparing enabled and disabled strokes.
      const points=Array.from({length:91},(_,i)=>({x:60+i*4,y:220+60*Math.sin(i/15)}));
      const newShape=()=>{d.querySelector('[data-tool="sand"]').click();$('draw-new').click();};
      const draw=(path,ending='pointerup')=>{
        emit('pointerdown',path[0].x,path[0].y);
        for(const p of path.slice(1))emit('pointermove',p.x,p.y);
        assert(r.gestureActive(),'Pointer gesture did not begin');
        const live=structuredClone(a.nodes.at(-1));
        emit(ending,path.at(-1).x,path.at(-1).y);return live;
      };
      const check=message=>line(`${units===1?'Whole':'Paged'}: ${message}`);
      newShape();const live=draw(points),reduced=structuredClone(a.nodes.at(-1));
      assert(reduced.points.length<live.points.length/4,'Too many editable points remain');
      assert(same(reduced.points[0],live.points[0])&&same(reduced.points.at(-1),live.points.at(-1)),'Endpoints moved');
      check(`${live.points.length} sampled points → ${reduced.points.length} editable points`);
      await a.settle();
      $('undo').click();assert(a.nodes.length===0,'Drawing was not one undo step');
      $('redo').click();assert(same(a.nodes.at(-1).points,reduced.points),'Redo lost simplified points');
      const saved=r.serializeGraph();r.loadGraph(saved);assert(same(a.nodes.at(-1).points,reduced.points),'Reload changed simplified points');
      check('one-step undo/redo and graph save/load');
      await a.settle();
      newShape();$('simplify-strokes').checked=false;
      const raw=draw(points);assert(same(a.nodes.at(-1).points,raw.points),'Disabled toggle simplified a stroke');
      $('simplify-strokes').checked=true;await a.settle();
      const scripted=r.applyStroke('sand',points);
      assert(same(a.nodes[scripted].points,points),'Scripted points were simplified');
      check('disabled toggle and scripted strokes preserve samples');
      await a.settle();
      r.select(0);$('draw-add').click();
      const original=structuredClone(a.nodes[0]),root=original.points[0];
      const branch=Array.from({length:41},(_,i)=>({x:root.x+i*3,y:root.y-i*4}));
      draw(branch);const branched=structuredClone(a.nodes[0]),path=branched.paths.at(-1);
      assert(branched.paths.length===2&&path[0]===0,'Branch lost its shared root');
      assert(path.length===2,'Straight branch was not simplified');
      assert(same(branched.points.slice(0,original.points.length),original.points),'Branch changed existing vertices');
      await a.settle();$('undo').click();assert(same(a.nodes[0].points,original.points)&&!a.nodes[0].paths,'Branch undo did not restore the original');
      $('redo').click();assert(same(a.nodes[0].paths,branched.paths),'Branch redo lost topology');
      check('attached branch simplifies independently and undo restores topology');
      await a.settle();r.select(0);$('draw-add').click();
      const before=structuredClone(a.nodes[0]);
      draw(Array.from({length:41},(_,i)=>({x:160+i*4,y:420})));
      const separate=a.nodes[0].paths.at(-1);
      assert(separate.length===2&&separate[0]===before.points.length,'Disconnected path acquired a connecting edge');
      assert(same(a.nodes[0].points.slice(0,before.points.length),before.points),'Disconnected path changed existing vertices');
      check('disconnected additions keep their own endpoints');
      await a.settle();r.select(0);$('draw-add').click();
      const beforeCancel=structuredClone(a.nodes[0]);draw(branch,'pointercancel');
      assert(same(a.nodes[0],beforeCancel),'Cancel changed the existing shape');
      const count=a.nodes.length;await a.settle();newShape();draw(points,'pointercancel');
      assert(a.nodes.length===count,'Canceled new stroke survived');
      await a.settle();newShape();draw([{x:250,y:100}]);
      assert(a.nodes.at(-1).points.length===1,'Click stamp was lost');
      check('canceled gestures restore originals; click stamps remain valid');
      await a.settle();assert(!$('error').textContent,$('error').textContent);
      w.interactionPerf.disposing=true;a.renderer.device.destroy();frame.remove();frame=null;
    }
    line('PASS: all simplified stroke checks completed');
  }catch(e){line('FAIL: '+e.stack);}
  finally{if(frame?.contentWindow.interactionPerf){frame.contentWindow.interactionPerf.disposing=true;frame.contentWindow.interactionEditor?.renderer.device.destroy();}button.disabled=false;}
};
</script></html>
