<!doctype html><html lang="en"><meta charset="utf-8"><title>Visible terrain priority</title>
<style>body{background:#172127;color:#def;font:15px system-ui;margin:24px}pre{white-space:pre-wrap}iframe{width:1280px;height:900px;border:1px solid #678}</style>
<h1>Visible terrain priority</h1><button id="run">Load map and zoom to 1×</button><pre id="results">Ready</pre><div id="host"></div>
<script type="module">
const output=document.querySelector('#results'),query=new URLSearchParams(location.search),delay=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(ok,text)=>{if(!ok)throw Error(text);},line=s=>output.textContent+=s+'\n';
document.querySelector('#run').onclick=async()=>{
  output.textContent='Running…\n';window.navigationResult=null;
  try{
    const frame=document.createElement('iframe');frame.src='/sculpt?biome=green&mapX=8&mapY=8&interaction=1&scratch=loading-check&heapMB=2048&weatheredView=1';document.querySelector('#host').replaceChildren(frame);
    const started=performance.now();while(!frame.contentWindow.interactionEditor?.ready()){assert(performance.now()-started<90000,'Startup timeout');await delay(100);}
    const w=frame.contentWindow,d=frame.contentDocument,a=w.interactionEditor,c=a.canvas,v=d.getElementById('viewport'),P=w.interactionPerf,next=()=>new Promise(r=>w.requestAnimationFrame(r));
    await a.settle();c.setBusy(true);
    const strokes=[];for(let y=0;y<3;y++)for(let x=0;x<3;x++)strokes.push(['landform',[[400+x*1300,450+y*1250],[650+x*1300,550+y*1250]],{card:{diameter:650,amount:120,roughness:35}}]);
    a.scene(strokes,{ground:true});
    // Reload the whole map from its recipe, as Load and a shared link do.
    const recipe=a.region.sketch();c.setBusy(false);await a.region.loadSketch(recipe);line('Map reloaded from its recipe');
    P.reset();const before=c.stats().field.gpuShape,t0=w.performance.now();c.zoom(1);v.scrollTo(1900,1600);await next();
    const view=c.view(),size=c.stats().displayChunkSize??c.stats().canonicalChunkSize,keys=[];
    for(let y=Math.floor(view.y/size)*size;y<view.y+view.height;y+=size)for(let x=Math.floor(view.x/size)*size;x<view.x+view.width;x+=size)keys.push(x+','+y+','+size+',detail');
    const done=()=>{const tiles=c.cacheSnapshot();return keys.every(key=>tiles.some(e=>e.key===key&&!e.dirty&&(e.scale??1)===1));};
    let firstFinalMs=null,firstDetailMs=null,detailCoverageMs=null;
    while(!done()){
      assert(w.performance.now()-t0<120000,'Visible completion timeout');
      const tiles=c.cacheSnapshot();
      if(firstDetailMs===null&&tiles.some(e=>keys.includes(e.key)&&!e.dirty))firstDetailMs=w.performance.now()-t0;
      if(detailCoverageMs===null&&keys.every(key=>tiles.some(e=>e.key===key&&!e.dirty)))detailCoverageMs=w.performance.now()-t0;
      if(firstFinalMs===null&&c.cacheSnapshot().some(e=>keys.includes(e.key)&&!e.dirty&&(e.scale??1)===1))firstFinalMs=w.performance.now()-t0;
      await next();
    }
    const visibleFinalMs=w.performance.now()-t0,after=c.stats().field.gpuShape;
    const visibleEnds=P.events.filter(e=>e.type==='bake-end'&&e.level===1&&keys.includes(e.x+','+e.y+','+size+',detail'));
    const finalGaps=visibleEnds.slice(1).map((e,i)=>e.t-visibleEnds[i].t),sortedGaps=finalGaps.slice().sort((a,b)=>a-b);
    const order=P.events.filter(e=>e.type==='bake-start'&&e.level===1).map(e=>({x:e.x,y:e.y,visible:keys.includes(e.x+','+e.y+','+size+',detail')}));
    // A margin bake can begin in the same task as the last visible paint.
    const firstMargin=order.findIndex(e=>!e.visible),visibleBeforeMargin=firstMargin<0?order:order.slice(0,firstMargin);
    assert(keys.every(key=>visibleBeforeMargin.some(e=>e.x+','+e.y+','+size+',detail'===key)),'Offscreen bake ran ahead of visible tiles');
    line('Visible terrain ready in '+Math.round(visibleFinalMs)+' ms');await a.settle();
    const terrain=d.getElementById('terrain'),pixels=()=>terrain.getContext('2d').getImageData(0,0,terrain.width,terrain.height).data,final=pixels();
    const png=await new Promise(r=>terrain.toBlob(r));await fetch('/interaction/save/loading-final.png',{method:'POST',body:png});
    c.invalidate();await a.settle();const fresh=pixels();let changed=0;for(let i=0;i<final.length;i++)if(final[i]!==fresh[i])changed++;
    assert(changed===0,'Priority changed final pixels');
    let fastView=null;
    const toggle=d.getElementById('weathered-view');
    if(toggle){
      const sketch=JSON.stringify(a.region.sketch()),exportRect={x:2048,y:1792,width:256,height:256};
      const exportPixels=async()=>{const bitmap=await c.debugBake(exportRect,1,true),cv=new w.OffscreenCanvas(bitmap.width,bitmap.height),g=cv.getContext('2d');g.drawImage(bitmap,0,0);bitmap.close();return g.getImageData(0,0,cv.width,cv.height).data;};
      const exportBefore=await exportPixels();
      toggle.checked=false;toggle.dispatchEvent(new w.Event('change'));await a.region.loadSketch(JSON.parse(sketch));
      const fastStart=w.performance.now(),weatherBefore=c.stats().field.gpuShape.weatherRuns;
      const authoredKeys=keys.map(key=>key.replace(/,detail$/,',authored'));
      while(!authoredKeys.every(key=>c.cacheSnapshot().some(e=>e.key===key&&!e.dirty&&(e.scale??1)===1))){assert(w.performance.now()-fastStart<30000,'Fast view timed out');await next();}
      const fastMs=w.performance.now()-fastStart;await a.settle();
      const weatherRuns=c.stats().field.gpuShape.weatherRuns-weatherBefore;
      assert(weatherRuns===0,'Fast view still requested weather simulations');
      assert(JSON.stringify(a.region.sketch())===sketch,'View toggle changed the map recipe');
      const exportAfter=await exportPixels();let exportChanges=0;for(let i=0;i<exportBefore.length;i++)if(exportBefore[i]!==exportAfter[i])exportChanges++;
      assert(exportChanges===0,'View toggle changed export art');
      toggle.checked=true;toggle.dispatchEvent(new w.Event('change'));await a.settle();
      const restored=pixels();let restoredChanges=0;for(let i=0;i<final.length;i++)if(final[i]!==restored[i])restoredChanges++;
      assert(restoredChanges===0,'Weathered view did not restore final pixels');
      fastView={visibleMs:fastMs,weatherRuns,exportChangedChannels:exportChanges,restoredChangedChannels:restoredChanges};
      line('Fast view and export isolation passed');
    }
    const result={passed:true,displayChunkSize:size,firstDetailMs,detailCoverageMs:detailCoverageMs??visibleFinalMs,firstFinalMs,visibleFinalMs,visibleTiles:keys.length,finalGapMedian:sortedGaps[Math.floor(sortedGaps.length*.5)],finalGapP95:sortedGaps[Math.floor(sortedGaps.length*.95)],finalGapMax:sortedGaps.at(-1),weatherRuns:after.weatherRuns-before.weatherRuns,weatherMs:after.weatherMsTotal-before.weatherMsTotal,coarsePagesDuringVisible:after.coarse.done-before.coarse.done,order,forcedRefreshChangedChannels:changed,fastView,errors:d.getElementById('error').textContent};
    assert(!result.errors,result.errors);await fetch('/interaction/save/loading.json',{method:'POST',body:JSON.stringify(result)});window.navigationResult=result;line(JSON.stringify(result,null,2));
  }catch(error){window.navigationResult={passed:false,error:error.stack};line('FAIL '+error.stack);}
};
if(query.has('auto'))document.querySelector('#run').click();
</script>
