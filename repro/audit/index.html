<!doctype html><html lang="en"><meta charset="utf-8"><title>Terraform control audit</title>
<style>body{background:#151d22;color:#dbe7e9;font:14px system-ui;margin:24px}button,select,input{font:inherit;padding:8px;margin:3px}pre{white-space:pre-wrap;max-height:380px;overflow:auto}iframe{width:1440px;height:1100px;border:1px solid #41525c}progress{width:600px}</style>
