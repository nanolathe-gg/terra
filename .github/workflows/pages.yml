# Checks the editor, builds the static site and deploys it to GitHub Pages (terra.nanolathe.gg).
# Owner, once: Settings > Pages > Source: "GitHub Actions"; custom domain terra.nanolathe.gg (DNS: a CNAME record to <owner>.github.io); Enforce HTTPS.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # site.test.mjs builds the site, and the site carries the map exporter: export/ built for WebAssembly.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: node --test repro/*.test.mjs
      - run: sh repro/gate.sh

  # Skipped while the repo is private (Pages is not on); it deploys once the repo is public and Pages' source is GitHub Actions.
  deploy:
    needs: check
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5   # the page's map exporter is built from export/ (GOOS=js GOARCH=wasm) into the build folder
        with:
          go-version-file: go.mod
      - name: Build the site
        run: |
          python3 sculpt.py --build-site _site
          echo terra.nanolathe.gg > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
