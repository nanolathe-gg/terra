# Checks the editor, builds the static site and deploys it to GitHub Pages (terra.nanolathe.gg).
# Owner, once: Settings > Pages > Source: "GitHub Actions"; custom domain terra.nanolathe.gg (DNS: a CNAME record to <owner>.github.io); Enforce HTTPS.
name: pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One group a ref: a pull request's run never replaces a pending run of main. The deploy job has its own group below, so deploys run one at a
# time and none is cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history, for the history check below
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh repro/check.sh quick
      # The deploy job is the only one that compiles the site packages, and it is gated off
      # while the repository is private; the check job compiles and tests them itself
      # (CPU only: no GPU, no browser, no network).
      - run: go build ./...
      - run: go test ./internal/...
      # The pre-push hook's history check, here too: a push without the hook, or a pull request, cannot bring generated preview PNGs or
      # browser output (smoke-out/, Chrome profiles) into the history.
      - name: Check the history for generated files
        run: go run ./cmd/previews check-history
      - name: Check preview freshness and publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/previews check --published

  # Skipped while the repo is private (Pages is not on); it deploys once the repo is public and Pages' source is GitHub Actions.
  deploy:
    needs: check
    if: ${{ !github.event.repository.private && github.event_name != 'pull_request' }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5   # the page's map exporter is built from export/ (GOOS=js GOARCH=wasm) into the build folder
        with:
          go-version-file: go.mod
      - name: Build the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site=$(go run ./cmd/terra --build-site _site)
          TERRAFORM_SITE_DIR="$site" node --test repro/site.build.test.mjs
          echo terra.nanolathe.gg > _site/CNAME
          touch _site/.nojekyll
      # A deploy replaces the whole site, and a tab opened before it loads its build's later files (export worker, WASM, palette, feature
      # worker) from its own b/<hash>/. The live build's folder is copied into this one (its files.txt lists them), so it lives one deploy
      # more. A live build without the list, or a copy that fails, is left out; the deploy goes on.
      - name: Keep the live build for open tabs
        run: |
          live=$(curl -fsS https://terra.nanolathe.gg/ | grep -o '<base href="b/[0-9a-f]*/">' | head -1 | sed 's/.*b\/\([0-9a-f]*\)\/.*/\1/') || live=''
          if [ -z "$live" ] || [ -d "_site/b/$live" ]; then echo "nothing to keep (live: ${live:-none})"; exit 0; fi
          keep=$(mktemp -d)
          if curl -fsS "https://terra.nanolathe.gg/b/$live/files.txt" -o "$keep/files.txt"; then
            ok=1
            while IFS= read -r name; do
              case "$name" in ''|/*|*..*) continue;; esac
              mkdir -p "$keep/$(dirname "$name")"
              curl -fsS "https://terra.nanolathe.gg/b/$live/$name" -o "$keep/$name" || { ok=0; break; }
            done < "$keep/files.txt"
            if [ "$ok" = 1 ]; then mkdir -p _site/b && mv "$keep" "_site/b/$live" && chmod -R a+rX "_site/b/$live" && echo "kept b/$live"; else echo "could not copy b/$live; deploying without it"; fi
          else echo "b/$live has no file list; deploying without it"; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
